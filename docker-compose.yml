services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wikirace
      POSTGRES_USER: wikirace
      POSTGRES_PASSWORD: wikirace
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikirace -d wikirace"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wikirace:wikirace@db:5432/wikirace
    profiles:
      - tools

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wikirace:wikirace@db:5432/wikirace
      SESSION_SECRET: change-me-in-production
      WIKIRACE_PUBLIC_URL: http://localhost:4321
    ports:
      - "4321:4321"

volumes:
  postgres-data:
